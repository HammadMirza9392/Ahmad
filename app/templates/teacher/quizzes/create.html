{% extends "layouts/teacher.html" %}
{% block title %}Create Quiz{% endblock %}
{% block page_title %}Create Quiz{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-plus-circle me-2"></i>Create Quiz</h1>
    <a href="{{ url_for('teacher.quizzes') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('teacher.quiz_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="title" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Subject <span class="text-danger">*</span></label>
                <select class="form-select" name="subject_id" required>
                    <option value="">— Select —</option>
                    {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="2"></textarea>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Total Marks</label>
                <input type="number" class="form-control" name="total_marks" value="0" min="0">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Passing Marks</label>
                <input type="number" class="form-control" name="passing_marks" value="0" min="0">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Duration (min)</label>
                <input type="number" class="form-control" name="duration_minutes" value="30" min="1">
            </div>
            <div class="col-md-3 mb-3"></div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Start At</label>
                <input type="datetime-local" class="form-control" name="start_at">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End At</label>
                <input type="datetime-local" class="form-control" name="end_at">
            </div>
        </div>
    </div></div>
    <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Create & Add Questions</button></div>
</form>
{% endblock %}
