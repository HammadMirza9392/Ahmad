{% extends "layouts/hod.html" %}
{% block title %}Add Semester{% endblock %}
{% block page_title %}Add Semester{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-plus-circle me-2"></i>Add Semester</h1>
    <a href="{{ url_for('hod.semesters') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.semester_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Batch <span class="text-danger">*</span></label>
                <select class="form-select" name="batch_id" required>
                    <option value="">— Select —</option>
                    {% for b in batches %}<option value="{{ b.id }}">{{ b.program.name if b.program else '' }} — {{ b.label }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Semester Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" required placeholder="Semester 1">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Number</label>
                <input type="number" class="form-control" name="number" placeholder="1">
            </div>
        </div>
    </div></div>
    <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Create Semester</button></div>
</form>
{% endblock %}
