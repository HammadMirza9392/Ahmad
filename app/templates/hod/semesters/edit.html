{% extends "layouts/hod.html" %}
{% block title %}Edit Semester{% endblock %}
{% block page_title %}Edit Semester{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Semester</h1>
    <a href="{{ url_for('hod.semesters') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.semester_edit', sem_id=sem.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Batch <span class="text-danger">*</span></label>
                <select class="form-select" name="batch_id" required>
                    {% for b in batches %}<option value="{{ b.id }}" {% if sem.batch_id == b.id %}selected{% endif %}>{{ b.program.name if b.program else '' }} — {{ b.label }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Semester Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" value="{{ sem.name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Number</label>
                <input type="number" class="form-control" name="number" value="{{ sem.number or '' }}" min="1" max="12">
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if sem.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
        </div>
    </div></div>
    <div class="mt-3 d-flex gap-2">
        <a href="{{ url_for('hod.semesters') }}" class="btn btn-light">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Update Semester</button>
    </div>
</form>
{% endblock %}
