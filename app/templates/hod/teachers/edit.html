{% extends "layouts/hod.html" %}
{% block title %}Edit Teacher{% endblock %}
{% block page_title %}Edit Teacher{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Teacher</h1>
    <a href="{{ url_for('hod.teachers') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.teacher_edit', teacher_id=teacher.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="full_name" value="{{ teacher.full_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="{{ teacher.email }}" disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ teacher.phone or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">New Password</label>
                <input type="text" class="form-control" name="password" placeholder="Leave blank to keep">
            </div>
            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if teacher.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
        </div>
    </div></div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save Changes</button>
    </div>
</form>
{% endblock %}
