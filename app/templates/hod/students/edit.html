{% extends "layouts/hod.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Student</h1>
    <a href="{{ url_for('hod.students') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.student_edit', student_id=student.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="full_name" value="{{ student.full_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" name="roll_number" value="{{ student.roll_number or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ student.phone or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Program</label>
                <select class="form-select" name="program_id">
                    <option value="">— Select —</option>
                    {% for p in programs %}<option value="{{ p.id }}" {% if student.program_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Batch</label>
                <select class="form-select" name="batch_id">
                    <option value="">— Select —</option>
                    {% for b in batches %}<option value="{{ b.id }}" {% if student.batch_id == b.id %}selected{% endif %}>{{ b.label }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Semester</label>
                <select class="form-select" name="semester_id">
                    <option value="">— Select —</option>
                    {% for s in semesters %}<option value="{{ s.id }}" {% if student.semester_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                </select>
                <div class="form-text">Changing semester re-allocates subjects.</div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Registration Number</label>
                <input type="text" class="form-control" name="registration_number" value="{{ student.registration_number or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">New Password</label>
                <input type="text" class="form-control" name="password" placeholder="Leave blank to keep">
            </div>
            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if student.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
        </div>
    </div></div>
    <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save Changes</button></div>
</form>

<form method="POST" action="{{ url_for('hod.student_promote', student_id=student.id) }}" class="mt-3" onsubmit="return confirm('Promote this student to their next semester?');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-outline-success"><i class="bi bi-arrow-up-circle me-1"></i> Promote to Next Semester</button>
</form>
{% endblock %}
