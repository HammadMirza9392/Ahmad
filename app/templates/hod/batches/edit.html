{% extends "layouts/hod.html" %}
{% block title %}Edit Batch{% endblock %}
{% block page_title %}Edit Batch{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Batch</h1>
    <a href="{{ url_for('hod.batches') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.batch_edit', batch_id=batch.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Program <span class="text-danger">*</span></label>
                <select class="form-select" name="program_id" required>
                    {% for p in programs %}<option value="{{ p.id }}" {% if batch.program_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" value="{{ batch.name }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Year</label>
                <input type="number" class="form-control" name="start_year" value="{{ batch.start_year or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Year</label>
                <input type="number" class="form-control" name="end_year" value="{{ batch.end_year or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="upcoming" {% if batch.status == 'upcoming' %}selected{% endif %}>Upcoming</option>
                    <option value="active" {% if batch.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="completed" {% if batch.status == 'completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if batch.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
        </div>
    </div></div>
    <div class="mt-3 d-flex gap-2">
        <a href="{{ url_for('hod.batches') }}" class="btn btn-light">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Update Batch</button>
    </div>
</form>
{% endblock %}
