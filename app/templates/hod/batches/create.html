{% extends "layouts/hod.html" %}
{% block title %}Add Batch{% endblock %}
{% block page_title %}Add Batch{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-plus-circle me-2"></i>Add Batch</h1>
    <a href="{{ url_for('hod.batches') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<form method="POST" action="{{ url_for('hod.batch_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card"><div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Program <span class="text-danger">*</span></label>
                <select class="form-select" name="program_id" required>
                    <option value="">— Select —</option>
                    {% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="Auto-generated from years if left blank">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Year</label>
                <input type="number" class="form-control" name="start_year" placeholder="2022">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Year</label>
                <input type="number" class="form-control" name="end_year" placeholder="2026">
            </div>
        </div>
    </div></div>
    <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Create Batch</button></div>
</form>
{% endblock %}
